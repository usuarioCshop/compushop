name: CI

# El repo no tenía ninguna pipeline: los tests sólo corrían si alguien los
# corría a mano. Este workflow es lo que hace que el guardia de
# backend/test/helpers.js tenga sobre quién gritar.
on:
  push:
    branches: [main, dev2]
  pull_request:
    branches: [main, dev2]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test
        env:
          # La suite es destructiva y corre contra una base propia (la branch
          # Neon `test`), nunca contra producción. Si este secret falta,
          # helpers.js FALLA a propósito en CI en lugar de saltarse los 24
          # tests y reportar un verde falso: ese es exactamente el bug que
          # este guardia existe para evitar.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
